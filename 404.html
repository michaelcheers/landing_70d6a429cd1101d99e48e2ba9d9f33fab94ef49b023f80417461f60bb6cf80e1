<!DOCTYPE html>
<html><head>
<meta charset="utf-8"/>
<title>Moving Papa</title>
<script>
  // GitHub Pages deep-link recovery: stash the requested URL and bounce to /.
  sessionStorage.setItem('mp_deeplink', location.pathname + location.search + location.hash);
  location.replace('/');
</script>
</head><body></body></html>
