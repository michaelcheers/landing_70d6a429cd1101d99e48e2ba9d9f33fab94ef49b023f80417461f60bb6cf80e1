  <!-- Mirrors not-found.tsx in the original Next app: if the visitor arrived
       from anywhere outside movingpapa.com (or directly via a typo'd URL),
       bounce them to the homepage with their query string preserved. Only
       show the real 404 UI when an internal link is broken. -->
  <script>
    (function () {
      function isInternalReferer(ref) {
        if (!ref) return false;
        try {
          var u = new URL(ref);
          if (u.protocol !== 'http:' && u.protocol !== 'https:') return false;
          var host = u.hostname.toLowerCase();
          return host === 'movingpapa.com' || host.endsWith('.movingpapa.com');
        } catch (e) { return false; }
      }
      if (!isInternalReferer(document.referrer)) {
        location.replace('/' + (location.search || ''));
      }
    })();
  </script>

  <style>
    :root { color-scheme: light; }
    body { margin: 0; font-family: system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; background: #f9fafb; color: #111827; }
    .wrap { min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 4rem 1rem; }

    .lede { font-size: 1.25rem; color: #4b5563; margin: 0 0 2rem; }
    .card { background: #fff; border-radius: 0.5rem; box-shadow: 0 10px 15px -3px rgba(0,0,0,0.1), 0 4px 6px -4px rgba(0,0,0,0.1); padding: 2rem; margin-bottom: 2rem; }
    .card h3 { font-size: 1.5rem; font-weight: 700; color: #34A853; margin: 0 0 1rem; }
    .card p { font-size: 1.125rem; color: #374151; margin: 0 0 1.5rem; }
    .phone-block + .phone-block { padding-top: 1rem; margin-top: 1rem; border-top: 1px solid #e5e7eb; }
    .phone-label { font-size: 0.875rem; color: #6b7280; margin: 0 0 0.25rem; }
    .phone-link { font-size: 1.875rem; font-weight: 700; color: #34A853; text-decoration: none; }
    .phone-link:hover { color: #2d8f47; }
    .home-btn { display: inline-block; padding: 0.75rem 2rem; background: #34A853; color: #fff; font-weight: 600; border-radius: 0.5rem; text-decoration: none; transition: background-color 0.15s; }
    .home-btn:hover { background: #2d8f47; }
    .links { margin-top: 1rem; font-size: 0.875rem; display: flex; justify-content: center; gap: 1rem; flex-wrap: wrap; }
    .links a { color: #34A853; text-decoration: none; }
    .links a:hover { text-decoration: underline; }
    .links .sep { color: #9ca3af; }
  </style>
</head>
