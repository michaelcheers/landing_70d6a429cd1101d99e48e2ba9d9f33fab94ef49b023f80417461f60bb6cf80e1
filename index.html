  <!-- Register the service worker, then inject the entry as an ES module once
       the SW is controlling the page. On first load, no reload is needed —
       we wait for the controllerchange event (SW calls clients.claim() in its
       activate handler) and then inject the script. -->
  <script>
  (async function () {
    function loadEntry() {
      var s = document.createElement('script');
      s.type = 'module';
      s.src = '/src/main.jsx';
      document.body.appendChild(s);
    }

    if (!('serviceWorker' in navigator)) {
      console.error('No service worker support; cannot transpile .jsx in the browser.');
      return;
    }

    try {
      await navigator.serviceWorker.register('/sw.js');
    } catch (e) {
      console.error('SW register failed:', e);
      return;
    }

    if (navigator.serviceWorker.controller) {
      loadEntry();
    } else {
      navigator.serviceWorker.addEventListener('controllerchange', function () {
        loadEntry();
      }, { once: true });
    }
  })();
  </script>
