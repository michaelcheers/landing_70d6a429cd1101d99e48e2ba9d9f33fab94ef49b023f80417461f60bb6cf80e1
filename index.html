  <!-- Register service worker that transpiles .jsx/.tsx imports on the fly. -->

    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('/sw.js').then(function(reg) {
        if (!navigator.serviceWorker.controller) {
          // First load: SW is installing; reload once it controls the page so
          // subsequent .jsx fetches go through the transpiler.
          reg.addEventListener('updatefound', function() {
            var sw = reg.installing;
            if (sw) sw.addEventListener('statechange', function() {
              if (sw.state === 'activated') location.reload();
            });
          });
        }
      }).catch(function(e) { console.error('SW register failed:', e); });
    }
  </script>
